name: check-queries

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every query has a documentation header
        run: python3 tools/check_queries.py
      - name: README index is up to date
        run: |
          python3 tools/build_index.py
          git diff --exit-code README.md || (echo "Run tools/build_index.py and commit README.md" && exit 1)
